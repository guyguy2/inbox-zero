[project]
name = "inbox-zero"
version = "0.1.0"
description = "Deterministic email triage, thread summaries, action items, contextual replies & calendar scheduling via Google Workspace CLI (gws)"
readme = "README.md"
authors = [
    { name = "Guy", email = "guylevi@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
inbox-zero = "inbox_zero:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
